<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quant Terminal — Multi-Factor Ranker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #0b0a09; }
      * { box-sizing: border-box; }
      @keyframes qt-fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes qt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      input, select, button { font-family: 'IBM Plex Mono', monospace; }
      input::placeholder { color: #6b6157; }
      ::-webkit-scrollbar { height: 8px; width: 8px; }
      ::-webkit-scrollbar-thumb { background: #2a2622; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
