# Copy this file to .github/workflows/update-feed.yml in YOUR public feed repo.
name: Update price feed

on:
  schedule:
    - cron: '30 21 * * 1-5'   # weekdays after US close (21:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python fetch_prices.py
      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || git commit -m "Update price feed"
          git push
